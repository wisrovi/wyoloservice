version: "3.8"

# Define reusable GPU resource constraints
x-resources: &resources_gpu
  shm_size: "64g"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    - NVIDIA_VISIBLE_DEVICES=0
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  deploy:
    resources:
      # limits:
      #   cpus: "6.0"
      #   memory: 16384M
      # memory_swap: 16384M
      reservations:
        cpus: "1.0"
        memory: 2048M
        # memory_swap: 500M
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  samba:
    image: dperson/samba
    ports:
      # - "137:137/udp"  # NetBIOS Name Service
      # - "138:138/udp"  # NetBIOS Datagram Service
      # - "139:139/tcp"  # NetBIOS Session Service
      - "7445:445/tcp" # SMB over TCP
    restart: always
    volumes:
      # - ./samba/config:/etc/samba  # Archivos de configuración de Samba
      - ./data/datasets:/data # Carpeta compartida
    environment:
      - TZ=Europe/Madrid # Zona horaria
      - USERID=1000 # ID de usuario (personaliza según tu sistema)
      - GROUPID=1000 # ID de grupo (personaliza según tu sistema)
      - SAMBA_USERS=wisrovi;wyoloservice
    command: >
      -u "wisrovi;wyoloservice" -s "shared;/data;yes;no;yes;all"
    networks:
      - nfs_network

  nfs:
    # image: erichough/nfs-server
    image: itsthenetwork/nfs-server-alpine:12
    environment:
      # - NFS_EXPORT_0=/datasets 192.168.1.0/24(rw,sync,no_subtree_check,no_root_squash) # Exporta a tu red local
      - SHARED_DIRECTORY=/datasets
    volumes:
      - ./data/datasets:/datasets # Asegúrate de que esta ruta sea correcta
    privileged: true
    restart: always
    ports:
      - 7446:2049
    networks:
      nfs_network:
          ipv4_address: 28.10.4.10 # IP interna del contenedor (no se usa para acceso externo)

  redis:
    image: redis:latest
    restart: always
    # ports:
    #   - "7447:6379"
    networks:
      - nfs_network

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=root
      - HTTP_PASSWORD=qwerty
    restart: always
    ports:
      - "7448:8081"
    depends_on:
      - redis
    networks:
      - nfs_network

  mlflow-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      - MINIO_ROOT_USER=mlflow
      - MINIO_ROOT_PASSWORD=wyoloservice
    ports:
      - "7449:9000" # Puerto para el servicio S3
      - "7450:9001" # Puerto para el panel de administración
    volumes:
      - ./tmp/mlflow_minio:/data
    networks:
      - nfs_network

  dvc-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      - MINIO_ROOT_USER=dvc
      - MINIO_ROOT_PASSWORD=wyoloservice
    ports:
      - "7451:9000" # Puerto para el servicio S3
      - "7452:9001" # Puerto para el panel de administración
    volumes:
      - ./data/dvc:/data
    networks:
      - nfs_network

  mlflow:
    build: 
      context: ./enviroment
      dockerfile: Dockerfile.mlflow
    # restart: always
    environment:
      # db
      - MLFLOW_BACKEND_STORE_URI=postgresql+psycopg2://postgres:postgres@postgres:5432/wyoloservice # Conexión a PostgreSQL
      # minio
      - MLFLOW_S3_ENDPOINT_URL=http://mlflow-minio:9000 # URL del servidor MinIO
      - AWS_ACCESS_KEY_ID=mlflow # Credenciales de MinIO
      - AWS_SECRET_ACCESS_KEY=wyoloservice # Credenciales de MinIO
      #mlflow
      - MLFLOW_TRACKING_URI=http://mlflow:5000 # URI de seguimiento de MLflow
      - MLFLOW_ARTIFACT_URI=s3://mlflow-artifacts/ # Bucket en MinIO donde se almacenarán los artefactos
    command:
      [
        "mlflow",
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "postgresql+psycopg2://postgres:postgres@postgres:5432/wyoloservice",
        "--default-artifact-root",
        "s3://mlflow-artifacts/",
      ]
    ports:
      - "7453:5000"
    networks:
      - nfs_network

  postgres:
    image: postgres:13.2
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=wyoloservice
    volumes:
      - ./tmp/db:/var/lib/postgresql/data
    # ports:
    #   - "7454:5432"
    restart: always
    networks:
      - nfs_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_container
    restart: always
    ports:
      - "7455:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: wisrovi.rodriguez@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 12345678
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - nfs_network

networks:
  nfs_network:
    external: true

volumes:
  pgadmin-data:
  dataset_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      # o: "addr=28.10.4.10,rw,nolock,soft,timeo=30,retrans=3"
      o: "addr=28.10.4.10,rw,nfsvers=4,async"
      device: ":/datasets"
# Para crear la red y el servidor NFS
# docker network create --subnet=28.10.4.0/24 --gateway=28.10.4.1 --driver=bridge nfs_network

# para el NFS, ver datos
# sudo apt install nfs-client -y
# sudo mkdir -p /mnt/wyoloservice/datasets
# sudo mount -v -o vers=4,loud <host-ip>:/ /mnt/wyoloservice/datasets

# para samba:
# smb://<host-ip>/shared

# Instrucciones de uso:
# 1. Crear un archivo .env con las variables de entorno necesarias.
# 2. Ejecutar `docker-compose up -d` para iniciar todos los servicios.
# 3. Acceder a los servicios:
#    - Samba: \\localhost\shared (Windows) o smb://localhost/shared (Linux/Mac)
#    - NFS: montado en /mnt/wyoloservice/datasets
#    - MLflow: http://localhost:5000
#    - MinIO Console: http://localhost:9006
#    - PgAdmin: http://localhost:1717
#    - API: http://localhost:8000
