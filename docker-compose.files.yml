version: "3.8"

# Define reusable GPU resource constraints
x-resources: &resources_gpu
  shm_size: "64g"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  environment:
    - NVIDIA_VISIBLE_DEVICES=0
    - NVIDIA_DRIVER_CAPABILITIES=compute,utility
  deploy:
    resources:
      # limits:
      #   cpus: "6.0"
      #   memory: 16384M
      # memory_swap: 16384M
      reservations:
        cpus: "1.0"
        memory: 2048M
        # memory_swap: 500M
        devices:
          - driver: nvidia
            device_ids: ["0"]
            capabilities: [gpu]

services:
  filebrowser:
    image: hurlenko/filebrowser
    volumes:
      - /media/training/Train_service_an/datasets:/data
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - FB_BASEURL=/
      - VIRTUAL_HOST=wisrovi.com
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=wisrovi.com
      - LETSENCRYPT_EMAIL=wisrovi.rodriguez@gmail.com
    restart: always
    ports:
      - "23443:8080"
  dataset-samba:
    image: dperson/samba
    ports:
      # - "137:137/udp"  # NetBIOS Name Service
      # - "138:138/udp"  # NetBIOS Datagram Service
      # - "139:139/tcp"  # NetBIOS Session Service
      - "23445:445/tcp" # SMB over TCP
    restart: always
    volumes:
      # - ./samba/config:/etc/samba  # Archivos de configuración de Samba
      - /media/training/Train_service_an/datasets:/data # Carpeta compartida
    environment:
      - TZ=Europe/Madrid # Zona horaria
      - USERID=1000 # ID de usuario (personaliza según tu sistema)
      - GROUPID=1000 # ID de grupo (personaliza según tu sistema)
      - SAMBA_USERS=wisrovi;wyoloservice
    command: >
      -u "wisrovi;wyoloservice" -s "shared;/data;yes;no;yes;all"
    networks:
      - nfs_network

  config-samba:
    image: dperson/samba
    restart: always
    volumes:
      - /media/training/Train_service_an/config_versions:/data
    environment:
      - TZ=Europe/Madrid # Zona horaria
      - USERID=1000 # ID de usuario (personaliza según tu sistema)
      - GROUPID=1000 # ID de grupo (personaliza según tu sistema)
      - SAMBA_USERS=wisrovi;wyoloservice
    command: >
      -u "wisrovi;wyoloservice" -s "shared;/data;yes;no;yes;all"
    ports:
      - "23447:445/tcp" # SMB over TCP

  db-samba:
    image: dperson/samba
    restart: always
    volumes:
      - /media/training/Train_service_an/database:/data
    environment:
      - TZ=Europe/Madrid # Zona horaria
      - USERID=1000 # ID de usuario (personaliza según tu sistema)
      - GROUPID=1000 # ID de grupo (personaliza según tu sistema)
      - SAMBA_USERS=wisrovi;wyoloservice
    command: >
      -u "wisrovi;wyoloservice" -s "shared;/data;yes;no;yes;all"
    ports:
      - "23448:445/tcp" # SMB over TCP

  nfs:
    # image: erichough/nfs-server
    image: itsthenetwork/nfs-server-alpine:12
    environment:
      # - NFS_EXPORT_0=/datasets 192.168.1.0/24(rw,sync,no_subtree_check,no_root_squash) # Exporta a tu red local
      - SHARED_DIRECTORY=/datasets
    volumes:
      - /media/training/Train_service_an/datasets:/datasets # Asegúrate de que esta ruta sea correcta
    privileged: true
    restart: always
    ports:
      - 23446:2049
    networks:
      nfs_network:
        ipv4_address: 28.10.4.10 # IP interna del contenedor (no se usa para acceso externo)

  mlflow-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      - MINIO_ROOT_USER=mlflow
      - MINIO_ROOT_PASSWORD=wyoloservice
    ports:
      - "23444:9000" # Puerto para el servicio S3
      - "23442:9001" # Puerto para el panel de administración
    volumes:
      - /media/training/Train_service_an/mlflow_minio:/data
    networks:
      - nfs_network

  dvc-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    restart: always
    environment:
      - MINIO_ROOT_USER=dvc
      - MINIO_ROOT_PASSWORD=wyoloservice
    ports:
      - "23441:9000" # Puerto para el servicio S3
      - "23440:9001" # Puerto para el panel de administración
    volumes:
      - /media/training/Train_service_an/dvc:/data
    networks:
      - nfs_network

networks:
  nfs_network:
    external: true

volumes:
  pgadmin-data:
  dataset_nfs:
    driver: local
    driver_opts:
      type: "nfs"
      # o: "addr=28.10.4.10,rw,nolock,soft,timeo=30,retrans=3"
      o: "addr=28.10.4.10,rw,nfsvers=4,async"
      device: ":/datasets"
# Para crear la red y el servidor NFS
# docker network create --subnet=28.10.4.0/24 --gateway=28.10.4.1 --driver=bridge nfs_network

# para el NFS, ver datos
# sudo apt install nfs-client -y
# sudo mkdir -p /mnt/wyoloservice/datasets
# sudo mount -v -o vers=4,loud <host-ip>:/ /mnt/wyoloservice/datasets

# para samba:
# smb://<host-ip>/shared

# Instrucciones de uso:
# 1. Crear un archivo .env con las variables de entorno necesarias.
# 2. Ejecutar `docker-compose up -d` para iniciar todos los servicios.
# 3. Acceder a los servicios:
#    - Samba: \\localhost\shared (Windows) o smb://localhost/shared (Linux/Mac)
#    - NFS: montado en /mnt/wyoloservice/datasets
#    - MLflow: http://localhost:5000
#    - MinIO Console: http://localhost:9006
#    - PgAdmin: http://localhost:1717
#    - API: http://localhost:8000
