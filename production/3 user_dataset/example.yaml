debug: wrodriguez
model: "yolov8n-cls.pt"
type: "yolo"
dvc_data_path: /datasets/clasificacion//colorball.v8i.multiclass.dvc
train:
  batch: 2
  data: /datasets/clasificacion/colorball.v8i.multiclass/
  epochs: 1
  imgsz: 640
# val:
#   conf: 0.01
# test:
#   conf: 0.01
sweeper:
  version: 2
  algorithm: optuna
  direction: maximize
  study_name: "example_clasification"
  sampler: "TPESampler" # TPESampler, RandomSampler, GridSampler
  tune: true # [opcional] para activar la busqueda de hiperparametros en modo de ajuste fino
  fitness: "metrics/accuracy_top1"
  n_trials: 2
  search_space:
    model: ["choice", "yolov8n-cls.pt"]
    train:
      imgsz: ["choice", 416, 512, 640, 720, 920, 1024]
      lr0: ["loguniform", 1e-5, 1e-2]
extras:
  gpu:
    id: 0
    limit: 0.95
metadata:
  content: "Este es un experimento de clasificación de imágenes."
  author: "William Rodriguez"
  documentation: "Este modelo fue entrenado con datos del 2025."
